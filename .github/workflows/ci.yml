name: AWS MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx mlflow skops

      - name: Train ML model
        run: |
          python train.py

      - name: Run automated tests
        run: |
          python -m pytest -v tests/

      - name: Build Docker image
        run: |
          docker build -t aws-mlops-api:${{ github.sha }} .
